workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      java: 17
      android_signing:
        - titanius
      vars:
        PACKAGE_NAME: "app.titanius.launcher"
      groups:
        - github
        - screenscraper
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches      
    scripts:
      - name: Set up build version and number
        script: | 
          BUILD_NUMBER=$((200 + PROJECT_BUILD_NUMBER))
          BUILD_NAME="0.5.$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "BUILD_NAME=$BUILD_NAME" >> $CM_ENV
      - name: Set up local.properties
        script: | 
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Clone screenscraper dependency
        script: | 
          git clone --depth 1 https://github.com/dsolonenko/screenscraper-api-dart.git ../screenscraper-api-dart
      - name: Clone retroachievements dependency
        script: | 
          git clone --depth 1 https://github.com/dsolonenko/retroachievements-api-dart.git ../retroachievements-api-dart
      - name: Get Flutter packages
        script: | 
          flutter pub get
      - name: Set up .env
        script: | 
          echo "SSDEVID=$SSDEVID" > "$CM_BUILD_DIR/.env"
          echo "SSDEVPWD=$SSDEVPWD" >> "$CM_BUILD_DIR/.env"
          echo "SSAPPNAME=$SSAPPNAME" >> "$CM_BUILD_DIR/.env"
      - name: Run build_runner
        script: | 
          dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze
        script: | 
          flutter analyze
        ignore_failure: true
      - name: Flutter unit tests
        script: | 
          flutter test
        ignore_failure: true
      - name: Build APK with Flutter
        script: | 
          flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      - name: Rename the apk file
        script: | 
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/titanius-launcher-$BUILD_NAME.apk
      - name: Upload APK to GitHub Releases
        script: |
          gh release create "$BUILD_NAME" --title "Release $BUILD_NAME" --notes "Automated release from CodeMagic" --draft "build/app/outputs/flutter-apk/titanius-launcher-$BUILD_NAME.apk"
    artifacts:
      - build/app/outputs/flutter-apk/titanius-launcher-*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - launcher@titanius.app
        notify:
          success: false
          failure: true